<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Copying the agent scores 71.5% overall and 0% on the decisions I overrode</title>
<desc id="d">Held-out results, 375 decisions. Overall accuracy and accuracy on the 53 overrides for five arms: random 36.0 and 30.2; always the first option 38.1 and 37.7; copying the agent's recommendation 71.5 and 0; qwen3:4b zero-shot 65.6 and 17.0; qwen3:4b with 4 past decisions 61.1 and 24.5. A trained model must reach 70.6 overall and 24.5 on overrides.</desc>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="40" y="58" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1f2328">Copying the agent scores 71.5% and gets every override wrong</text>
<text x="40" y="94" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#59636e">375 held-out decisions, options shuffled, the agent's recommendation hidden. A trained model must clear both dashed lines.</text>
